name: Build packages

# Builds the ready-to-run zip for each system.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0 to
# also publish the zips as a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest      # Windows 10/11, 64-bit
          - os: ubuntu-22.04        # Linux x64 (older base = runs on more distributions)
          - os: ubuntu-22.04-arm    # Raspberry Pi 4/5 with 64-bit Raspberry Pi OS
          - os: macos-14            # Apple Silicon Macs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Download models
        run: python scripts/get_models.py
      - name: Test
        run: python -m pytest -q
      - name: Package
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: CampusAssistant-${{ matrix.os }}
          path: dist/*.zip
          compression-level: 0  # already zipped

  release:
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
